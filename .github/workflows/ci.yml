name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest

    # The tests run against real PostgreSQL on purpose. The schema uses JSONB
    # and native enums, so a SQLite suite would pass while production broke —
    # that trade-off is explained in the README and this service is what pays
    # for it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cadence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cadence_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cadence_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: pytest -q

      # The structural tier of the eval harness needs no API key: it asserts
      # that every case validates against the schema, scores inside bounds and
      # carries the full dimension set. The comparative tier needs a real model
      # and is not run here — a prompt change that breaks the structure is
      # caught, one that degrades quality is not, and that is worth being clear
      # about rather than pretending CI covers it.
      - name: Scorer evals (structural)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cadence_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: python -m evals.run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - run: npm run build
